<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DrillDash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233987e5'/><path d='M16 5v16M11 17l5 9 5-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/vendor/uPlot.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    try { const s = JSON.parse(localStorage.getItem('drilldash.v1') || '{}'); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="DrillDash home">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--series-1)"/><path d="M16 5v16M11 17l5 9 5-9" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>DrillDash</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="top-actions">
      <label class="seg" title="Unit system">
        <select id="unitSel" aria-label="Unit system">
          <option value="metric">Metric</option>
          <option value="imperial">Imperial</option>
        </select>
      </label>
      <label class="seg" title="Time zone">
        <select id="tzSel" aria-label="Time zone">
          <option value="utc">UTC</option>
          <option value="well">Well local</option>
        </select>
      </label>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <div class="shell">
    <nav class="sidenav" id="sidenav" aria-label="Sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="modalRoot"></div>
  <script src="/static/vendor/uPlot.iife.min.js"></script>
  <script src="/static/vendor/plotly.min.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
